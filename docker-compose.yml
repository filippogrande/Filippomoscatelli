version: "3.8"

services:
  cv-website:
    image: filippogrande/cv-website:latest
    container_name: filippomoscatelli-cv-local
    ports:
      - "8080:80"
    environment:
      - NGINX_WORKER_PROCESSES=1
      - NGINX_WORKER_CONNECTIONS=1024
    restart: unless-stopped
    # wget di busybox: nell'immagine non c'e' piu' curl (pacchetto inutile, e ogni
    # pacchetto in meno e' una superficie CVE in meno).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cv.rule=Host(`localhost`)"
      - "traefik.http.services.cv.loadbalancer.server.port=80"

networks:
  default:
    name: cv-network
