        # Tutto il resto di /analytics/ (dashboard, login, API) non esiste per
        # l'esterno. ATTENZIONE: non si puo' usare `return 404`, perche' il
        # server block ha `error_page 404 /index.html` e nginx riscriverebbe la
        # risposta in index.html con status 200 — cioe' la dashboard resterebbe
        # raggiungibile mostrando la home. 410 non e' mappato in error_page,
        # quindi esce com'e'.
        location /analytics/ {
            return 410;
        }
