events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml+rss
        application/json;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Cache static assets. Scadenza breve (1m) per evitare che CDN/browser restino
        # incollati a versioni vecchie dei file JS/CSS: i nomi versionati (.v2) danno
        # il refresh immediato al deploy, questa scadenza è la rete di sicurezza.
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1m;
            add_header Cache-Control "public";
            access_log off;
        }

        # Cache PDFs for shorter time
        location ~* \.(pdf)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # JSON (data/work.json, projects.json): se mancante risponde 404 REALE,
        # non facendo ricadere la richiesta su index.html (che altrimenti rompe il
        # fetch con "Unexpected token <").
        location ~* \.json$ {
            try_files $uri =404;
            error_page 404 =404;
            add_header Cache-Control "no-cache";
        }

        # Main location
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Handle language routing
        location ~ ^/(it|en)/?$ {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
