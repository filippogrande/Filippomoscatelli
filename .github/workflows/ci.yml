name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # html-validate legge .htmlvalidate.json (preset recommended con le regole
      # di stile disattivate) e .htmlvalidateignore (file esclusi: test-projects.html
      # e FoodDelivery/, non serviti dall'immagine e non ancora ripuliti).
      # Il glob "**/*.html" e' racchiuso tra virgolette: a shell aperto verrebbe
      # espanso in cwd (indice .htmlvalidateignore) invece che passato al tool.
      - name: Validate HTML
        run: npx --yes html-validate "**/*.html"

  js:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ESLint 9+ usa solo la flat config (eslint.config.js): --ext e .eslintrc non
      # esistono piu', e senza config fallisce. La config e' nel repo, ma il passo
      # resta una guardia: se manca o e' rotta il workflow si ferma qui.
      - name: Syntax check
        run: |
          npm install --save-dev eslint
          npx eslint js/
