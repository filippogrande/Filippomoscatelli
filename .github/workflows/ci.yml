name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML validation
        run: |
          npm install -g html-validate
          html-validate "**/*.html"
      - name: JS syntax check
        run: |
          npm install -g eslint
          eslint . --ext .js
