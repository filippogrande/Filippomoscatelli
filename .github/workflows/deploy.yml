name: Build and Deploy CV Website

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_k8s:
        description: "Deploy to Kubernetes"
        required: false
        default: "false"
        type: boolean

env:
  IMAGE_NAME: filippogrande/cv-website
  REGISTRY: docker.io

jobs:
  build:
    name: Build Docker Image
    # Runner fissato: da ottobre 2026 'ubuntu-latest' migra a Ubuntu 26.04.
    # Qui conta davvero, perche' la generazione PDF usa il Chrome preinstallato
    # e il job installa pacchetti npm. L'aggiornamento a 26.04 si fa qui, dopo
    # averlo provato.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    outputs:
      image_digest: ${{ steps.buildpush.outputs.digest }}
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Regola dei tag: `latest` solo sulle major/minor (patch 0), le patch
      # vanno su `pre-release`. Cosi' chi consuma l'immagine sceglie se stare
      # sul ramo stabile o sulle patch, senza inventarsi tag a mano.
      - name: Compute release tag
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION non valida: '$VERSION' (atteso X.Y.Z)"
            exit 1
          fi
          PATCH="${VERSION##*.}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PATCH" = "0" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION e' un rilascio: andra' anche su :latest"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION e' una patch: andra' su :pre-release, latest resta fermo"
          fi

      # I PDF del CV non sono piu' file caricati a mano: si generano da
      # print-cv.html, che legge gli stessi JSON e le stesse traduzioni del
      # sito. Girano PRIMA della build Docker cosi' il COPY . del Dockerfile
      # prende i PDF appena generati e l'immagine pubblicata li contiene
      # sempre aggiornati. Chrome e' preinstallato sull'immagine ubuntu-24.04
      # (/usr/bin/google-chrome); puppeteer-core non scarica un browser suo.
      - name: Set up Node for PDF generation
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Generate CV PDFs
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Verifica vera dell'output: esistenza, firma %PDF e dimensione minima.
      # Senza questo un PDF vuoto o troncato passerebbe inosservato fino al
      # download dell'utente finale.
      - name: Check generated PDFs
        run: |
          for f in filippomoscatelli_it.pdf filippomoscatelli_en.pdf; do
            if [ ! -s "$f" ]; then echo "Manca o e' vuoto: $f"; exit 1; fi
            if [ "$(head -c 5 "$f")" != "%PDF-" ]; then echo "Non e' un PDF: $f"; exit 1; fi
            bytes=$(wc -c < "$f")
            if [ "$bytes" -lt 20000 ]; then echo "Sospettosamente piccolo ($bytes byte): $f"; exit 1; fi
            echo "$f OK ($bytes byte)"
          done

      # I PDF non vengono committati: chi rivede la PR li scarica da qui.
      - name: Upload generated CV PDFs
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf-${{ github.event.pull_request.number || github.run_id }}
          path: |
            filippomoscatelli_it.pdf
            filippomoscatelli_en.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Su pull_request {{branch}} e' VUOTA: il vecchio
      # type=sha,prefix={{branch}}- generava il tag non valido ":-<sha>"
      # e faceva fallire il build su OGNI PR. Prefisso ora fisso.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=pre-release,enable=${{ steps.ver.outputs.is_release == 'false' }}

      # PR: build locale single-platform (load nel runner, nessun push) con un
      # tag esplicito, cosi' lo smoke test puo' avviare davvero l'immagine.
      # Push su main: build multi-platform + push su Docker Hub.
      - name: Build and push Docker image
        id: buildpush
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/386' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: "${{ github.event_name == 'pull_request' && format('{0}/{1}:pr-{2}', env.REGISTRY, env.IMAGE_NAME, github.event.number) || steps.meta.outputs.tags }}"
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Non basta /health: qui si verifica che l'immagine contenga davvero i PDF
      # appena generati e che li serva come application/pdf. Se il passo dei PDF
      # venisse spostato dopo la build, questa verifica fallisce.
      - name: Test Docker image
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}"
          else
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.buildpush.outputs.digest }}"
          fi
          echo "Testing image $IMAGE_REF"
          docker run --rm -d -p 8080:80 --name test-cv "$IMAGE_REF"
          sleep 10
          curl -f http://localhost:8080/health || (docker logs test-cv && exit 1)

          for f in filippomoscatelli_it.pdf filippomoscatelli_en.pdf; do
            if [ "$(curl -fsS http://localhost:8080/$f | head -c 5)" != "%PDF-" ]; then
              echo "L'immagine non serve un PDF valido su /$f"
              docker logs test-cv
              exit 1
            fi
            echo "/$f servito dall'immagine"
          done

          if ! curl -fsS -o /dev/null http://localhost:8080/print-cv.html; then
            echo "print-cv.html non servito dall'immagine"
            exit 1
          fi

          # Nell'immagine non c'e' piu' curl: l'HEALTHCHECK usa il wget di busybox.
          # Va provato DENTRO il container, altrimenti un'immagine senza wget
          # resterebbe 'unhealthy' in produzione senza che la CI se ne accorga.
          # 127.0.0.1 e non localhost: nel container localhost risolve prima in
          # IPv6 e nginx ascolta solo su IPv4.
          if ! docker exec test-cv wget -q -O /dev/null http://127.0.0.1/health; then
            echo "Healthcheck interno fallito: wget assente o /health non risponde su 127.0.0.1"
            docker logs test-cv
            exit 1
          fi
          echo "healthcheck interno (wget su 127.0.0.1) OK"

          # --- Guardie anti-regressione -------------------------------------
          # 1. nginx.conf non deve finire nella web root: era servito su
          #    /nginx.conf ed esponeva header policy, cache e path interni.
          if docker exec test-cv test -e /usr/share/nginx/html/nginx.conf; then
            echo "LEAK: nginx.conf presente nella web root dell'immagine"
            exit 1
          fi
          echo "nginx.conf assente dalla web root (atteso)"

          # 2. js/config.js non deve contenere URL con IP di rete interna.
          if ! docker exec test-cv test -f /usr/share/nginx/html/js/config.js; then
            echo "js/config.js non presente nell'immagine: controllo saltato male"
            exit 1
          fi
          if docker exec test-cv grep -Eq 'https?://192\.168\.[0-9]{1,3}\.[0-9]{1,3}' /usr/share/nginx/html/js/config.js; then
            echo "LEAK: js/config.js contiene un IP di rete interna"
            docker exec test-cv grep -En 'https?://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' /usr/share/nginx/html/js/config.js
            exit 1
          fi
          echo "js/config.js senza IP interni (atteso)"

          # 3. Di Umami si espongono solo gli endpoint del tracker. Dashboard,
          #    login e API di autenticazione devono rispondere 410, non la SPA:
          #    con `error_page 404 /index.html` un `return 404` tornerebbe 200 con
          #    la home, quindi il codice atteso e' 410 e va verificato davvero.
          for p in /analytics/login /analytics/api/auth/login /analytics/api/websites /analytics/share/abc; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$p")"
            if [ "$code" != "410" ]; then
              echo "ESPOSTO: $p risponde $code (atteso 410)"
              exit 1
            fi
          done
          echo "Umami: solo gli endpoint del tracker sono raggiungibili"

          docker stop test-cv || true

  # Traccia il rilascio nella pagina Deployments: tag git vX.Y.Z (da VERSION) e un
  # deployment 'production' che dice esattamente a che punto siamo. Lo stato e'
  # PENDING di proposito: l'immagine e' pubblicata, il sito non e' ancora stato
  # spostato (il passaggio sul master e' manuale). Diventa SUCCESS con il workflow
  # 'Confirm production deploy', quando il deploy e' davvero avvenuto.
  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the release
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION gia' esistente: la versione non e' stata bumpata"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "CV v$VERSION - $(git rev-parse --short HEAD)"
            git push origin "v$VERSION"
            echo "Creato tag v$VERSION"
          fi

      - name: Create deployment
        id: dep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          jq -n \
            --arg ref "v$VERSION" \
            --arg desc "Sito v$VERSION - immagine sha-$SHORT_SHA" \
            '{ref:$ref, environment:"production", description:$desc, auto_merge:false, required_contexts:[], transient_environment:false}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - > deployment.json
          ID="$(jq -r '.id' deployment.json)"
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Creazione del deployment fallita:"
            cat deployment.json
            exit 1
          fi
          # $GITHUB_OUTPUT vuole righe chiave=valore, non il valore nudo:
          # scrivere solo l'id fa fallire il passo con 'Invalid format'.
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Deployment creato: id=$ID"

      - name: Mark deployment as pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/${{ steps.dep.outputs.id }}/statuses" \
            -f state=pending \
            -f description="Immagine pubblicata su Docker Hub, deploy sul master non ancora confermato" \
            -f environment_url="https://filippomoscatelli.com" \
            -F auto_inactive=true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      # Action pinnata: prima era @master, cioe' codice che cambia sotto i piedi
      # a ogni run, in un job con security-events: write.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image_digest }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      # Il SARIF aggiorna la scheda Security ma nel log non lascia nulla: senza
      # questo passaggio non hai modo di vedere i conteggi per severita' se non
      # aprendo GitHub. exit-code 0: il verdetto resta al SARIF, qui serve solo
      # la tabella.
      - name: Trivy summary (tabella nel log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image_digest }}
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"
